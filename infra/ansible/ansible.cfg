# Smart Helpdesk host configuration (docs/09-infrastructure/ansible.md). Run from infra/ansible.
[defaults]
inventory = inventory/onprem.ini
roles_path = roles:galaxy_roles
collections_path = collections
retry_files_enabled = false
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
forks = 5

[ssh_connection]
pipelining = true
