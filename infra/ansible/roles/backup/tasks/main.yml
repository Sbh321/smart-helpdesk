# Host backup safety net (backups.md §Host safety net): pg_dump + RustFS archive via a systemd timer.
- name: Install the backup and restore scripts
  ansible.builtin.copy:
    src: "{{ repo_root }}/infra/scripts/{{ item }}.sh"
    dest: /usr/local/bin/{{ item }}
    owner: root
    group: root
    mode: "0755"
  loop: [helpdesk-backup, helpdesk-restore]

- name: Install the backup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [helpdesk-backup.service, helpdesk-backup.timer]
  notify: Reload systemd

- name: Flush handlers so the timer unit is known
  ansible.builtin.meta: flush_handlers

- name: Enable the daily backup timer
  ansible.builtin.systemd_service:
    name: helpdesk-backup.timer
    enabled: true
    state: started
