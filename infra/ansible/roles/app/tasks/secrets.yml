# Per-host secrets, generated once on the controller and kept next to the inventory
# (host_vars/<host>.secrets.yml, 0600, gitignored). Re-running reuses them; losing the file means the
# database roles, backups' credentials and APP_KEY no longer match (disaster-recovery.md).
- name: Locate the persisted secrets file
  ansible.builtin.set_fact:
    app_secrets_file: "{{ inventory_dir }}/../host_vars/{{ inventory_hostname }}.secrets.yml"

- name: Check for previously generated secrets
  ansible.builtin.stat:
    path: "{{ app_secrets_file }}"
  delegate_to: localhost
  become: false
  register: app_secrets_stat

- name: Load previously generated secrets
  ansible.builtin.include_vars:
    file: "{{ app_secrets_file }}"
    name: app_saved_secrets
  when: app_secrets_stat.stat.exists

- name: Generate missing secrets
  vars:
    saved: "{{ app_saved_secrets | default({}) }}"
  ansible.builtin.set_fact:
    app_secrets:
      db_superuser_password: "{{ saved.db_superuser_password | default(lookup('community.general.random_string', length=32, special=false)) }}"
      db_owner_password: "{{ saved.db_owner_password | default(lookup('community.general.random_string', length=32, special=false)) }}"
      db_app_password: "{{ saved.db_app_password | default(lookup('community.general.random_string', length=32, special=false)) }}"
      db_backup_password: "{{ saved.db_backup_password | default(lookup('community.general.random_string', length=32, special=false)) }}"
      valkey_password: "{{ saved.valkey_password | default(lookup('community.general.random_string', length=32, special=false)) }}"
      health_token: "{{ saved.health_token | default(lookup('community.general.random_string', length=40, special=false)) }}"
      s3_key: "{{ saved.s3_key | default(lookup('community.general.random_string', length=20, special=false, lower=false)) }}"
      s3_secret: "{{ saved.s3_secret | default(lookup('community.general.random_string', length=40, special=false)) }}"
      app_key: "{{ saved.app_key | default('base64:' + lookup('community.general.random_string', length=32, base64=true)) }}"
      monitor_password: "{{ saved.monitor_password | default(lookup('community.general.random_string', length=24, special=false)) }}"
      monitor_password_hash: "{{ saved.monitor_password_hash | default('') }}"
      platform_admin_password: "{{ saved.platform_admin_password | default(lookup('community.general.random_string', length=24, special=false)) }}"
  no_log: true

- name: Persist the secrets next to the inventory
  ansible.builtin.copy:
    dest: "{{ app_secrets_file }}"
    content: "{{ app_secrets | to_nice_yaml }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

- name: Write the Compose file secrets
  ansible.builtin.copy:
    dest: "{{ app_dir }}/secrets/{{ item }}"
    content: "{{ app_secrets[item] }}"
    owner: "{{ container_uid }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  loop: [db_superuser_password, db_owner_password, db_app_password, db_backup_password]
  no_log: true

- name: Generate the Passport signing key (once per install)
  ansible.builtin.command: openssl genrsa -out {{ app_dir }}/secrets/oauth-private.key 4096
  args:
    creates: "{{ app_dir }}/secrets/oauth-private.key"

- name: Derive the Passport public key
  ansible.builtin.command: openssl rsa -in {{ app_dir }}/secrets/oauth-private.key -pubout -out {{ app_dir }}/secrets/oauth-public.key
  args:
    creates: "{{ app_dir }}/secrets/oauth-public.key"

- name: Let the container user read the Passport keys
  ansible.builtin.file:
    path: "{{ app_dir }}/secrets/{{ item }}"
    owner: "{{ container_uid }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  loop: [oauth-private.key, oauth-public.key]
