# Base hardening (ansible.md §Roles: common). Container test targets switch off swap, sshd and kernel tuning.
- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, openssl, python3, unattended-upgrades, sudo, cron, tar, gzip]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the time zone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: [sudo]
    append: true

- name: Allow the deploy user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-{{ deploy_user }}
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Authorise the deploy SSH key
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_ssh_public_key }}"
  when: deploy_ssh_public_key | length > 0

- name: Harden SSH (key-only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-smart-helpdesk.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: harden_ssh | bool
  notify: Reload sshd

- name: Create the swap file
  ansible.builtin.command: >-
    sh -c 'fallocate -l {{ swap_size_mb }}M /swapfile && chmod 600 /swapfile && mkswap /swapfile'
  args:
    creates: /swapfile
  when: swap_size_mb | int > 0
  register: common_swapfile

- name: Enable the swap file now  # noqa: no-handler (needed before the next task, not at the end of the play)
  ansible.builtin.command: swapon /swapfile
  when: common_swapfile is changed
  changed_when: true

- name: Enable the swap file at boot
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present
  when: swap_size_mb | int > 0

- name: Let Valkey fork for persistence (vm.overcommit_memory=1)
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    sysctl_file: /etc/sysctl.d/60-smart-helpdesk.conf
  when: kernel_tuning | bool
