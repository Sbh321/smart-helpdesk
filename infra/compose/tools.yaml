# Optional tools selected by profile (included from compose.yaml).
services:
  mailpit:
    image: ${MAILPIT_IMAGE:-ghcr.io/axllent/mailpit:v1.31.1}
    profiles: [dev]
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks: [internal]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
