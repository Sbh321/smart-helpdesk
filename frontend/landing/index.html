<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme before first paint, as the application does (index.html, docs/06-design-system/themes.md). -->
    <script>
      (() => {
        let stored = null;
        try {
          stored = window.localStorage.getItem('sh.theme');
        } catch {
          // Blocked storage: follow the system.
        }
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia?.('(prefers-color-scheme: dark)').matches === true);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <title><!--landing-title--></title>
    <meta name="description" content="<!--landing-description-->" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="<!--landing-title-->" />
    <meta property="og:description" content="<!--landing-description-->" />
    <meta property="og:image" content="/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" type="image/webp" href="/images/queue-light-1280.webp"
      imagesrcset="/images/queue-light-1280.webp 1280w, /images/queue-light-2560.webp 2560w"
      imagesizes="(min-width: 1152px) 1104px, calc(100vw - 2rem)" />
    <link rel="stylesheet" href="../src/landing/landing.css" />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="landing"><!--landing-html--></div>
    <script type="module" src="../src/landing/client.ts"></script>
  </body>
</html>
