# Figures of the report. Since the A4 revision the diagrams are the report's own (source: report): they are
# simplified from the docs/ diagrams so that their text prints at about 10 pt, and tools/export-figures.js
# no longer overwrites them. Render everything with tools/render-diagrams.sh:
#   - <id>.mmd with mermaid.config.json (report font and spacing)
#   - uc-01, uc-02, gantt and waterfall from tools/usecase-diagrams.py, gantt-diagram.py and waterfall-diagram.py (SVG, rendered by tools/render-svg.js)
# Screenshots (app-*.png) are captured from the demonstration workspace with the redesigned interface.
figures:
  - { id: waterfall, caption: "Waterfall model of the development", source: report }
  - { id: uc-01, caption: "Use case diagram of ticket handling and automation", source: report }
  - { id: uc-02, caption: "Use case diagram of administration, contacts and reporting", source: report }
  - { id: gantt, caption: "Gantt chart of the project schedule", source: report }
  - { id: class-domain, caption: "Class diagram of the domain model", source: report }
  - { id: object-ticket, caption: "Object diagram of a seeded ticket", source: report }
  - { id: state-ticket, caption: "State diagram of the ticket lifecycle", source: report }
  - { id: state-sla, caption: "State diagram of an SLA timer", source: report }
  - { id: seq-create-ticket, caption: "Sequence diagram of ticket creation", source: report }
  - { id: seq-sla-sweep, caption: "Sequence diagram of the SLA check", source: report }
  - { id: seq-inbound-email, caption: "Sequence diagram of inbound email processing", source: report }
  - { id: act-assignment, caption: "Activity diagram of agent assignment", source: report }
  - { id: act-duplicates, caption: "Activity diagram of duplicate detection", source: report }
  - { id: act-inbound, caption: "Activity diagram of inbound email routing", source: report }
  - { id: class-automation, caption: "Algorithm interfaces and their baseline implementations", source: report }
  - { id: er-full, caption: "Entity relationship diagram", source: report }
  - { id: component, caption: "Component diagram", source: report }
  - { id: deployment, caption: "Deployment diagram", source: report }
