# Smart Helpdesk services (docs/09-infrastructure/docker.md).
#   development: `docker compose up` also loads compose.override.yaml automatically
#   production:  `docker compose -f compose.yaml -f infra/compose/prod.yaml up -d`
name: smart-helpdesk

include:
  - infra/compose/tools.yaml   # mailpit (dev), webhook-echo (dev, demo)

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-backend: &backend
  image: ${BACKEND_IMAGE:-smart-helpdesk-backend:local}
  build:
    context: ./backend
    target: ${BACKEND_TARGET:-production}
  env_file:
    - path: ${BACKEND_ENV_FILE:-./backend/.env}
      required: true
  environment:
    # Realtime switch (M3-16, docs/03-architecture/realtime.md): set both in the root .env together with
    # COMPOSE_PROFILES=…,realtime; the defaults keep polling only.
    REALTIME_ENABLED: ${REALTIME_ENABLED:-false}
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  secrets: [db_owner_password, db_app_password]
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }
  logging: *logging

services:
  proxy:
    image: ${PROXY_IMAGE:-smart-helpdesk-proxy:local}
    build:
      context: ./frontend
      # docs/ for the platform documentation site built into the image (Dockerfile, M5-06).
      additional_contexts:
        docs: ./docs
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2.11-alpine}
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set PLATFORM_DOMAIN in .env}
      HOST_LAYOUT: ${HOST_LAYOUT:-split}
      TLS_MODE: ${TLS_MODE:-acme}
      APP_SERVE: ${APP_SERVE:-static}
      MAIL_WEB_UPSTREAM: ${MAIL_WEB_UPSTREAM:-mail:8080}
      MAIL_ADMIN_UPSTREAM: ${MAIL_ADMIN_UPSTREAM:-mail:8080}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-false}
      # Public Pusher-protocol key for the SPA's runtime config.json; equals the backend's REVERB_APP_KEY.
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge: {}
      internal:
        # Containers (e2e runner, webhook-echo) reach the public hosts through the proxy.
        aliases:
          - ${PLATFORM_DOMAIN}
          - app.${PLATFORM_DOMAIN}
          - api.${PLATFORM_DOMAIN}
          - admin.${PLATFORM_DOMAIN}
          - monitor.${PLATFORM_DOMAIN}
          - docs.${PLATFORM_DOMAIN}
          - platform-docs.${PLATFORM_DOMAIN}
          - files.${PLATFORM_DOMAIN}
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    <<: *backend
    # Health check comes from the image (curl http://localhost:8080${HEALTHCHECK_PATH}).

  horizon:
    <<: *backend
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan horizon' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      # Replaced by a heartbeat check in M1-16.
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  reverb:
    <<: *backend
    profiles: [realtime]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-trixie}
    entrypoint: ["/usr/local/bin/helpdesk-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    secrets: [db_superuser_password, db_owner_password, db_app_password, db_backup_password]
    volumes:
      - pg-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/entrypoint.sh:/usr/local/bin/helpdesk-entrypoint.sh:ro
    networks: [internal]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:9-alpine}
    command:
      - sh
      - -c
      - exec valkey-server --save 60 1 --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction $${VALKEY_PASSWORD:+--requirepass "$$VALKEY_PASSWORD"}
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
    volumes: [valkey-data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli $${VALKEY_PASSWORD:+-a \"$$VALKEY_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  rustfs:
    image: rustfs/rustfs:1.0.0
    profiles: [storage]
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-helpdesk}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-helpdesk-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes: [object-data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Bundled mail server (ADR-0018, docker.md §Mail). Profile `mail`; configured by
  # infra/scripts/mail-init.sh (`just mail-init`), which completes Stalwart's bootstrap, creates the
  # `app` submission and `inbound` accounts, the catch-all, the DKIM key and the relay route, and prints
  # the DNS records. STALWART_RECOVERY_ADMIN is the management credential mail-init.sh uses.
  mail:
    image: ${STALWART_IMAGE:-stalwartlabs/stalwart:v0.16.22-alpine}
    profiles: [mail]
    hostname: mail.${PLATFORM_DOMAIN}
    command: ["--config", "/var/lib/stalwart/config.json"]
    environment:
      STALWART_RECOVERY_ADMIN: admin:${MAIL_ADMIN_PASSWORD:-}
    volumes: [mail-data:/var/lib/stalwart]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # Stalwart's management CLI for mail-init.sh (`docker compose run --rm -T mail-cli …`); never started by `up`.
  mail-cli:
    image: ${STALWART_CLI_IMAGE:-stalwartlabs/cli:1.0.12}
    profiles: [mail-tools]
    environment:
      STALWART_URL: http://mail:8080
      STALWART_USER: admin
      STALWART_PASSWORD: ${MAIL_ADMIN_PASSWORD:-}
    networks: [internal]

networks:
  edge: {}
  internal: {}

volumes:
  pg-data: {}
  valkey-data: {}
  object-data: {}
  caddy-data: {}
  caddy-config: {}
  mail-data: {}

secrets:
  db_superuser_password: { file: ./secrets/db_superuser_password }
  db_owner_password: { file: ./secrets/db_owner_password }
  db_app_password: { file: ./secrets/db_app_password }
  db_backup_password: { file: ./secrets/db_backup_password }
